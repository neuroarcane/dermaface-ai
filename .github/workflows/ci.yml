name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling + test deps
        # ruff is pinned: an unpinned upgrade broadened the default rule set and
        # turned CI red on an unrelated commit. Bump deliberately.
        run: pip install ruff==0.16.0 pytest numpy scikit-learn Pillow imagehash

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Smoke tests (pytest)
        run: pytest -q
